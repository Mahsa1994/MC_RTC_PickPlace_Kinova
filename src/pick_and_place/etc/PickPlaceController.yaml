MainRobot: Kinova6DOF
ControllerName: PickPlaceController
z_min_limit: 0.15

home_pose:
  translation: [0.287, 0.175, 0.392]
  rotation: [3.0087, 0.0020, 1.7769]

pick_pose:
  translation: [0.40, 0.10, 0.15]
  rotation:    [3.1416, 0.0, 0.0]

place_pose:
  translation: [0.35, -0.10, 0.15]
  rotation:    [3.1416, 0.0, 0.0]

StatesLibraries:
  - /home/vscode/workspace/install/pick_and_place/lib/mc_states

StatesFiles: []
IdleKeepState: true
# Full pick-and-place loop restored (2026-08-19) after HoldCurrent's
# translational sign check + gain tuning passed live, and after the
# joint_trajectory_controller nonzero-end-velocity fix. Safety scope for this
# is "participants only ever contact the gripper/end-effector area" (chosen
# deliberately over whole-arm contact safety, which this architecture does
# not provide - see MoveToPick/MoveToPlace comments below).
# Unfold removed (2026-08-19) - pipeline now starts directly at MoveHome.
# Unfold's job was a small joint-space move to a known-consistent starting
# configuration before the Cartesian legs began; skipping it means MoveHome's
# BSpline path to home_pose now starts from wherever the arm actually is,
# which is only as safe as that starting pose is reasonable (no known issue
# observed, but this was Unfold's whole reason for existing - if MoveHome
# ever takes a surprising path, this is the first thing to reconsider).
# Definition preserved, commented out, below - re-enable by setting this back
# to `init: Unfold` and uncommenting its state + transition.
init: MoveHome

states:

  # Push/release sanity check: capture the arm's current pose as the
  # ImpedanceTask target and hold it there (duration is a long fixed
  # ceiling, not an actual move - target == start pose, so there is no
  # motion to converge to). Push the arm -> it should yield; release ->
  # it should settle back toward this same captured pose. Ctrl+C the
  # bridge when done; there's no natural exit from this state.
  HoldCurrent:
    base: ComplianceCartesianMove
    target:
      ref: current
    waypoints: []
    duration: 3600.0
    stiffness: 25.0
    damping: 12.0
    weight: 100.0
    contact_force_threshold: 8.0   # must stay above deadband_force on the bridge
    clear_hold_time: 0.3
    next: HoldCurrent
    # Softened after live test felt too rigid (defaults: stiffness 800 N/m /
    # 40 Nm/rad meant deflection = force/800 - a 1N push only earned ~1.25mm).
    # 4x softer here (kept from the previous round).
    #
    # mass raised back from 1->2 (2026-08-19): mass=1 felt jerky at the start
    # of a push ("brake then go") - likely the virtual compliant target
    # responding faster than real joint static friction can break away,
    # getting ahead before the joint catches up. Splitting the difference
    # between the original default (3) and the too-eager value (1) reduced
    # that gap without giving back the stiffness softening.
    #
    # linear mass/stiffness/damping reverted to match impedance_control's
    # KinovaImpedance.yaml (2026-08-19): that config was already validated to
    # move well through the base/shoulder joints, not just the wrist - my
    # earlier linear stiffness (200) was 2x stiffer than its proven value
    # (100), which suppressed exactly the translational motion that would
    # recruit those joints. Angular left as-is (already softer than the old
    # config's 20, and rotation/wrist motion was already working fine - not
    # implicated in this complaint). UNTESTED live - retest before trusting it.
    gains:
      mass:
        linear:  [3, 3, 3]
        angular: [2, 2, 2]
      stiffness:
        linear:  [100, 100, 100]
        angular: [10, 10, 10]
      damping:
        linear:  [60, 60, 60]
        angular: [15, 15, 15]

  # -- Unfold, removed from the pipeline 2026-08-19, see note near `init:`
  # above. Target was last updated to match the arm's actual resting pose,
  # confirmed via encoder readings (FIRST CMD MISMATCH log) consistent
  # across every real-hardware test this session:
  #   joint_1=-2.936 joint_2=-0.034 joint_3=-1.827
  #   joint_4=-0.006 joint_5=-1.049 joint_6=-1.774
  # An earlier target assumed a different "monitoring snapshot pose" that
  # didn't match reality - joints 1/4/5 were off by ~130-140 deg, well past
  # the bridge's FIRST CMD MISMATCH safety gate, so Unfold could never
  # actually publish a command. If you re-enable this and park the arm
  # somewhere else first, update these values to match - the intent is a
  # small, safe move that confirms joint naming/direction, not a large jump.
  # Unfold:
  #   base: JointMove
  #   target: [-2.936, -0.034, -1.827, -0.006, -1.049, -1.774]
  #   duration: 15.0      # very slow — 15 s to move essentially nowhere
  #   stiffness: 50.0      # minimal gain — arm will move gently
  #   threshold: 0.05     # 0.05 rad (~3°) convergence threshold
  #   next: MoveHome

  # Rigid (non-compliant) - fine here since this runs before/after the task,
  # not while a human is expected to be reaching into the workspace.
  MoveHome:
    base: CartesianMove
    target:
      ref: home
    duration: 15.0
    stiffness: 4.0
    weight: 1000.0
    pos_threshold: 0.02
    settle_timeout: 5.0
    next: MoveToPick

  # ── Pick-and-place cycle ─────────────────────────────────────────────
  # MoveToPick and MoveToPlace are ComplianceCartesianMove: they yield if
  # the human pushes the arm off its path (trajectory clock pauses until
  # the wrench clears), then resume toward the same target. MoveToPlace is
  # the experimentally-relevant leg - `waypoints` sets the trajectory shape
  # and `duration` sets the average speed, both changeable here without
  # recompiling for different HRI trial conditions.
  # Contact-safety scope: participants only ever contact the gripper/
  # end-effector area (chosen deliberately - this architecture's wrench
  # estimate is computed as-if applied at the tool frame, so contact
  # elsewhere on the arm's body yields inconsistently, see session notes
  # 2026-08-19). Gains matched to HoldCurrent's live-tuned values below.
  MoveToPick:
    base: ComplianceCartesianMove
    target:
      ref: pick
    waypoints:
      - [0.40, 0.10, 0.25]   # hover ~10cm above pick_pose before descending
    duration: 4.0
    stiffness: 25.0
    damping: 12.0
    weight: 100.0
    contact_force_threshold: 8.0   # must stay above deadband_force on the bridge
    clear_hold_time: 0.3
    next: CloseGripper
    gains:
      mass:
        linear:  [3, 3, 3]
        angular: [2, 2, 2]
      stiffness:
        linear:  [100, 100, 100]
        angular: [10, 10, 10]
      damping:
        linear:  [60, 60, 60]
        angular: [15, 15, 15]

  CloseGripper:
    base: Gripper
    action: close
    timeout: 2.0
    next: MoveToPlace

  # THE experiment-manipulation state: vary `waypoints` for trajectory shape
  # and `duration` for velocity between trials.
  MoveToPlace:
    base: ComplianceCartesianMove
    target:
      ref: place
    waypoints: []   # add via-points here to change the trajectory shape
    duration: 5.0    # shorten/lengthen to change arm velocity
    stiffness: 20.0
    damping: 10.0
    weight: 100.0
    contact_force_threshold: 8.0
    clear_hold_time: 0.3
    next: OpenGripper
    gains:
      mass:
        linear:  [3, 3, 3]
        angular: [2, 2, 2]
      stiffness:
        linear:  [100, 100, 100]
        angular: [10, 10, 10]
      damping:
        linear:  [60, 60, 60]
        angular: [15, 15, 15]

  OpenGripper:
    base: Gripper
    action: open
    timeout: 3.0
    next: ReturnHome

  ReturnHome:
    base: CartesianMove
    target:
      ref: home
    duration: 4.0
    stiffness: 4.0
    weight: 1000.0
    pos_threshold: 0.02
    settle_timeout: 5.0
    next: Idle

transitions:
  - [HoldCurrent,  HoldCurrent,  HoldCurrent,  Auto]
  # - [Unfold,       MoveHome,     MoveHome,     Auto]  # Unfold removed, see note near `init:` above
  - [MoveHome,     MoveToPick,   MoveToPick,   Auto]
  - [MoveToPick,   CloseGripper, CloseGripper, Auto]
  - [CloseGripper, MoveToPlace,  MoveToPlace,  Auto]
  - [MoveToPlace,  OpenGripper,  OpenGripper,  Auto]
  - [OpenGripper,  ReturnHome,   ReturnHome,   Auto]
  - [ReturnHome,   Idle,         Idle,         Auto]
constraints:
  - type: kinematics
  - type: dynamics
    damper: [0.1, 0.01, 0.5]
  - type: collision
    r1: kinova_6dof
    r2: kinova_6dof
    collisions:
      - type: all
        iDist: 0.15
        sDist: 0.05
        damping: 0.0
