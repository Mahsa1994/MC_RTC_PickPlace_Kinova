MainRobot: Kinova6DOF
ControllerName: PickPlaceController
z_min_limit: 0.15

home_pose:
  
  translation: [-0.0000, 0.0014, 1.1766]
  rotation: [-0.0000, 0.0001, 3.1413]

pick_pose:
  # REPLACED 2026-08-26: fresh physical capture as part of the MoveToZero ->
  # MoveToSafe -> MoveToPick -> PickUpPos sequence (see snapshots/
  # MoveToPick.txt). NOT yet dry-run/live validated as this pipeline's
  # target.
  translation: [-0.5570, 0.0008, 0.2944]
  rotation:    [0.0041, 2.4140, 3.1119]

place_pose:
  # REPLACED 2026-09-07 - real capture, superseding the never-tested
  # 2026-08-19 placeholder ([0.35, -0.10, 0.15] / [3.1416, 0, 0], which sat
  # at +x, the opposite side of the robot from everything else in this file).
  # Derived the same mc_rtc-native way as pick_pose/MoveToSafe/PickUpPos:
  # arm jogged to the place location, then read straight off MoveToZero's
  # startup log (raw capture kept in snapshots/MoveToPlace.txt):
  #   real tool_frame translation: [-0.4984, +0.4515, +0.5492]
  #   real tool_frame rotation [roll,pitch,yaw] (deg): [-61.67, +135.66, +110.06]
  # Cross-checked against snapshots/MoveToPlace.json (the Kinova web-app
  # snapshot of the same pose) via tools/snapshot_to_joints.py: the joint
  # angles agree to 0.00027 rad (0.015 deg), i.e. web-app rounding only.
  # Joint configuration there: [0.7344, -0.5168, 1.1662, -0.0047, 0.2341,
  # -0.0054] - margins to the nearest limit are comfortable on every
  # constrained joint (joint_2 1.72 rad, joint_3 1.40 rad, joint_5 1.86 rad),
  # so this is not near the limit-lock failure mode that plagued the earlier
  # pick_pose candidates.
  # CURRENTLY UNREFERENCED (2026-09-07): the place side was rewritten as a
  # carry-and-tip sequence (MoveUpFromPick -> HoverToPlace -> UnloadObj),
  # all captured as joint configurations, so no state resolves `ref: place`
  # any more. Kept because it is a valid, cross-checked capture of that
  # location and costs nothing - it becomes live again the moment any state
  # uses `ref: place`. NOTE it is NOT the same spot as HoverToPlace
  # (that one's tool pose is [-0.2360, +0.3378, +0.4003]).
  translation: [-0.4984, 0.4515, 0.5492]
  rotation:    [-1.0763, 2.3677, 1.9208]

# ═════════════════════════════════════════════════════════════════════════
#  TRIAL PROFILES - selectable at runtime, no restart
# ═════════════════════════════════════════════════════════════════════════
# Select one while everything is running:
#     ros2 topic pub --once /trial_config std_msgs/msg/String "data: 'base'"
# Defined names right now: slow, base, fast.
#
# The arm parks at start_1/TrialGate between cycles and begins the requested
# trial from there. Driver, bridge, wrench tare and the arm's live state all
# persist between trials - that is what makes back-to-back runs comparable.
#
# step_2 is the only leg a profile can reshape: it is the sole Cartesian
# state and the only one the participant is near. A profile may set
#   targets:   {step_2: [x, y, z]}        - move the traverse ENDPOINT
#   waypoints: {step_2: [[x,y,z], ...]}   - bow the mid-path (SEE WARNING)
# Anything a profile omits keeps the state's own value.
#
# GEOMETRY (rebuilt 2026-10-12). The traverse runs step_1 -> step_2:
#     [+0.0033, +0.2373, +0.2880]  ->  [+0.0156, +0.6575, +0.2345]
# i.e. 0.4237 m almost purely along +y. 'far' is the captured pose, so it
# needs no override at all; 'near' and 'baseline' move toward the
# participant and are filled in once their poses are captured.
#
# ⚠ WARNING ON `waypoints:` - A CURVE WILL CURRENTLY STOP THE ARM.
# ComplianceCartesianMove::targetAt() applies its quintic PER SEGMENT, and a
# quintic has zero velocity at BOTH ends, so every via-point brings the arm
# to a complete stop mid-traverse. This was seen live on 2026-09-30 (the
# fast_far test showed visible move/stop intervals). A stop is a salient
# motion cue, so a curve built this way would confound distance with
# smoothness - the two things the study is trying to separate. Use
# `targets:` until targetAt() is reworked to arc-length-parameterise the
# whole polyline under a single quintic.
trials:
  # ── DISTANCE x SPEED, 9 cells ────────────────────────────────────────
  # Publish one by name:
  #     ros2 topic pub --once /trial_config std_msgs/msg/String "data: 'far1_fast'"
  #
  # The two factors are independent and compose cleanly:
  #   entry:        which chain to run  -> start_1 / start_2 / start_3
  #   speed_scale:  how fast to run it  -> 1.0 / 1.6 / 2.5
  #                 (raised from 0.5 / 1.0 / 2.5 on 2026-10-21: slow 2x and
  #                 base 1.6x faster. fast unchanged - 2.5 is already at the
  #                 ~0.17 rad/s the arm can track through the bridge, so a
  #                 higher fast needs bridge work, not a bigger number here.
  #                 Each level is ~1.6x the one below.)
  # Each chain drives to its OWN start pose first and returns there at the
  # end, so conditions can be run in any order without a sequence effect.
  #
  # The bare names (near / far1 / far2 / slow / base / fast) are GONE - they
  # each named only one factor, so a log line reading "trial 'far1'" left the
  # speed implicit and "trial 'fast'" left the geometry implicit. Every name
  # now states both, which makes the per-run log self-documenting. Ask if you
  # want the shorthands back as aliases for the _base cells.
  #
  # ⚠ THE VELOCITY GATE MAKES COMPLIANCE SPEED-DEPENDENT. The bridge scales
  # the estimated wrench down as the arm moves faster (qd_gate 0.05 -> 0.3
  # rad/s), so the SAME push registers differently per speed: ~91% of it at
  # slow, ~74% at base, ~48% at fast (near's compliant leg at its peak, for
  # the 1.0 / 1.6 / 2.5 scales). A contact that pauses the arm in a slow
  # trial may not in a fast one. That is a confound between the speed factor
  # and the compliance behaviour - worth deciding how to handle before
  # collecting data (widen qd_gate_high, or scale contact_force_threshold
  # with speed the way stall_lag_enter now is).

  # ── near (entry start_1) ──
  near_slow:
    speed_scale: 1.0
    entry: start_1
  near_base:
    speed_scale: 1.6
    entry: start_1
  near_fast:
    speed_scale: 2.5
    entry: start_1

  # ── far1 (entry start_2) ──
  far1_slow:
    speed_scale: 1.0
    entry: start_2
  far1_base:
    speed_scale: 1.6
    entry: start_2
  far1_fast:
    speed_scale: 2.5
    entry: start_2

  # ── far2 (entry start_3) ──
  far2_slow:
    speed_scale: 1.0
    entry: start_3
  far2_base:
    speed_scale: 1.6
    entry: start_3
  far2_fast:
    speed_scale: 2.5
    entry: start_3

# ═════════════════════════════════════════════════════════════════════════
#  speed_scale - THE ONE KNOB TO CHANGE PER TRIAL CONDITION
# ═════════════════════════════════════════════════════════════════════════
# Multiplies every motion state's v_max / v_max_lin / v_max_ang AND divides
# every `duration`, so the whole cycle gets uniformly faster or slower from a
# single number. 1.0 = the validated baseline below (~4.8 min of motion per
# cycle); 2.0 = twice as fast (~2.4 min); 0.5 = half speed.
#
# `duration` has to scale too, not just v_max: it is a FLOOR, and any leg
# pinned by it would otherwise ignore the knob completely. MoveUpFromPick is
# exactly that case today (15.0s floor vs a 14.0s v_max term), so scaling
# v_max alone would leave it at 15s no matter what and the cycle would not
# actually speed up.
#
# CEILING: the TOP-LEVEL speed_scale is clamped to [0.1, 3.0] in
# PickPlaceController.cpp. A trials: profile's speed_scale is NOT clamped -
# it is assigned straight through - so a typo there goes to the arm as-is.
# MEASURED, not estimated. A live run at 2.0 showed MoveToSafe commanding a
# 0.100 rad/s peak while the real arm saturated near 0.077 rad/s; the
# shortfall accumulated into the 0.03 stall guard every ~1.5 s, giving a
# continuous brake-and-go judder with nobody touching the robot.
#
# The limit is NOT delta_max. The bridge publishes a new single-point
# trajectory every 10 ms but asks the joint_trajectory_controller to reach it
# in 50 ms with ZERO terminal velocity, so the arm is always decelerating
# toward a point that gets replaced before it arrives. To go genuinely faster,
# fix that (shorten time_from_start toward the publish period, and/or publish
# a non-zero terminal velocity) - raising speed_scale past 1.5 only makes the
# model outrun the arm.
#
# 1.0 is the only value validated end-to-end on hardware. 2.0 is known to
# judder. Step through 1.25 and watch "model-vs-real" in the per-state logs:
# it should stay well under 0.03. If it ramps toward 0.03 repeatedly, the arm
# is already at its tracking limit for that leg.
#
# Per-leg overrides still work: set a state's own v_max* if one leg needs to
# differ from the global scale (e.g. keeping the descent slow while the
# traverse speeds up).
# Set TRUE together with the bridge's dry_run to validate trajectories in
# RViz. In dry_run nothing is published, so realRobot() never moves and
# model-vs-real divergence grows by construction - the stall guard then
# resyncs the model back onto the stationary arm every time it trips, making
# the model creep ~1 mm and look frozen. This suppresses that guard so the
# model runs the whole path.
# MUST be false for any live run - it disables the protection that stops the
# model outrunning the real arm into a model_real_gate deadlock.
dry_run_validation: false

# 2.5 -> 1.0 on 2026-10-12 after a live run juddered on start_1.
# At 2.5 the leg's feedforward peak is v_max*2.5 = 0.125 rad/s, the posture
# task adds feedback on top (measured commanded peak 0.1657 rad/s), and the
# real arm delivered 0.1535 - a 7% shortfall that accumulated straight into
# the 0.03 stall guard. The guard then resynced, which zeroes model-vs-real
# BY CONSTRUCTION, so it un-latched immediately and the accumulated lag hit
# the posture task as a step: commanded 0.7950 rad/s against 0.0308 real
# (4% tracking). Result was a ~70 ms brake-and-go sawtooth - stalls logged
# at 17.50 / 17.56 / 17.63 / 17.71 / 17.78 / 17.85 / 17.92 s.
# At 1.0 the peak is 0.05 rad/s, roughly 3x under the measured ceiling.
speed_scale: 1.0
# ─────────────────────────────────────────────────────────────────────────
#  EXPERIMENT KNOBS (2026-09-07) - what to change per trial condition
# ─────────────────────────────────────────────────────────────────────────
# The HRC study varies the arm's DISTANCE and VELOCITY relative to the
# participant, so both need to be settable per leg without recompiling.
# Every knob below lives in this file only.
#
# SPEED. Prefer `speed_scale` above for whole-cycle changes; the per-state
# knobs below are for making ONE leg differ from the rest.
# Each motion state computes
#     effective_duration = max(duration / speed_scale,
#                              1.875 * distance / (v_max * speed_scale))
# and follows a quintic (minimum-jerk) profile over it, so the ACTUAL speed
# is whichever of the two limits is slower:
#   * `duration`  - a MINIMUM time, not the speed. Raising it slows a leg
#                   down; lowering it alone does NOT speed a leg up.
#   * `v_max`     - JointMove legs, rad/s per joint.
#   * `v_max_lin` / `v_max_ang` - Cartesian legs, m/s and rad/s.
# At the current v_max values (0.05) the v_max term dominates on every real
# leg - e.g. MoveToPick's ~0.47 m translation + large reorientation stretches
# a configured `duration: 4.0` to well over a minute. So to make trials
# FASTER you must raise v_max* (and may then also need to lower `duration`);
# changing `duration` alone will do nothing visible.
# CEILING: keep v_max (and the joint speeds v_max_lin/v_max_ang imply) under
# the bridge's delta_max-derived limit - at delta_max=0.002 rad/tick and
# 100 Hz publishing that is ~0.2 rad/s of real joint motion. Command past it
# and the real arm silently falls behind the model until model_real_gate
# trips and blocks publishing (this cost three E-stops before those gates
# existed - see the launch file's history).
#
# DISTANCE / TRAJECTORY SHAPE.
#   * `waypoints: [[x,y,z], ...]` - Cartesian legs only, which after the
#     2026-09-07 rewrite means MoveToPick and HoverToPlace. Via-points are
#     passed through on the way to the target and inherit the target's
#     orientation.
#   * HoverToPlace is the one that matters for the study: it is the
#     participant-facing traverse, and it is Cartesian precisely so that its
#     path can be reshaped per condition (a via-point bowing the path toward
#     or away from the person) and so that it yields on contact.
#   * The remaining JointMove legs (MoveToZero, MoveToSafe, PickUpPos,
#     MoveUpFromPick, UnloadObj, ReturnToPickPose) interpolate straight in
#     joint space and have no waypoint support - shape one by converting it
#     to Cartesian, or by inserting another intermediate pose.
#   * WATCH WHICH LIMIT BINDS: a leg's duration is set by whichever of
#     v_max_lin / v_max_ang needs longer. HoverToPlace is angular-limited
#     (0.968 rad of reorientation vs 0.377 m of travel), so raising
#     v_max_lin alone does nothing there - raise v_max_ang. Each Cartesian
#     leg logs both deltas at startup, so check the log rather than assume.
#
# COMPLIANCE (how the arm yields to a participant pushing it) is per
# Cartesian leg: `stiffness`/`damping`/`weight`, the `gains:` block, and
# `contact_force_threshold` / `clear_hold_time`. Only the Cartesian legs are
# compliant; JointMove legs are rigid by design.

StatesLibraries:
  - /home/vscode/workspace/install/pick_and_place/lib/mc_states

StatesFiles: []
IdleKeepState: true

# CYCLE ENTRY CHANGED 2026-09-23: MoveToZero -> MoveToSafe.
# The cycle now starts by going to MoveToSafe from wherever the arm happens
# to be (MoveToSafe is a JointMove, so it interpolates from the current
# configuration), then runs the pick/transfer/unload sequence. MoveToZero is
# still defined below and simply unreferenced - restore by setting
# `init: MoveToZero` and re-adding the [MoveToZero, MoveToSafe, ...]
# transition.
# Rationale: Zero is straight up, the furthest configuration from every pose
# the cycle actually uses, which made it a poor reference for the startup
# wrench tare. Entering at MoveToSafe keeps the arm inside its working range
# throughout.
# Park at the gate on launch and move nothing until a trial is published.
# Each trial's chain BEGINS with its own start pose (start_1 / start_2 /
# start_3), so there is no longer a single "the" start pose to init to -
# picking one would silently make it the default condition. Nothing moves
# until you publish, which is also the safer startup.
init: TrialGate
states:

  # Push/release sanity check: capture the arm's current pose as the
  # ImpedanceTask target and hold it there (duration is a long fixed
  # ceiling, not an actual move - target == start pose, so there is no
  # motion to converge to). Push the arm -> it should yield; release ->
  # it should settle back toward this same captured pose. Ctrl+C the
  # bridge when done; there's no natural exit from this state.
  HoldCurrent:
    base: ComplianceCartesianMove
    target:
      ref: current
    waypoints: []
    duration: 3600.0
    stiffness: 25.0
    damping: 12.0
    weight: 100.0
    contact_force_threshold: 8.0   # must stay above deadband_force on the bridge
    # ADDED 2026-09-18 - the channel that actually sees a human contact here.
    # A live test with a hand in the arm's path produced raw force ~0.86 N
    # (below the bridge's 1.0 N deadband_force, so it reached the task as
    # exactly 0.00) but moment ~1.5 Nm. Force-based detection therefore never
    # fired at any threshold; this one does. 0.00 Nm when clear, ~1.5 Nm when
    # blocked, so 0.5 leaves wide margin both ways.
    # RAISED 0.5 -> 2.0 on 2026-09-23, deliberately trading contact
    # sensitivity for a usable speed range (speed is the studied factor).
    # What the task actually sees is the POST-deadband estimate, and the
    # bridge's 1.5 Nm deadband_moment already suppresses the no-contact
    # baseline completely up to ~speed_scale 2 - which is why 1.0 and 1.5
    # produced Est. moment 0.00 and never false-triggered. At 2.0 the
    # baseline grazes the deadband and ~1.26 Nm leaked through, tripping the
    # old 0.5 threshold. 2.0 clears that leak while a real hand contact
    # (~1.5 Nm ON TOP of the baseline, so ~2.8 Nm at this speed) still
    # trips it.
    # INTERIM VALUE - it rests on one measurement and no payload. Re-measure
    # with the container attached, see contact_moment_speed_gain below.
    contact_moment_threshold: 2.0
    # Speed-tracking term, Nm per rad/s of joint speed (2026-09-23).
    # The no-contact baseline grows linearly with speed because the bridge's
    # inverse dynamics has no joint-friction term:
    #     baseline ~= 0.41 + 11.5 * max|qd|   (measured, R^2 = 0.976)
    # 11.5 is that measured slope, so the effective threshold stays ~0.5 Nm
    # above the baseline at EVERY speed. That is what lets speed_scale be
    # varied as an experimental factor without the compliance behaviour
    # changing with it - a fixed threshold either false-triggers at high
    # speed or, if raised enough to avoid that, sits above a real human
    # contact (1.50 Nm measured) and detects nothing.
    # RE-MEASURE AFTER ATTACHING THE CONTAINER: the payload shifts the
    # baseline's intercept (its gravity moment is pose-dependent and the
    # startup tare only cancels it at the tare pose), and may change this
    # slope too. Set to 0 for the old fixed-threshold behaviour.
    contact_moment_speed_gain: 0.0
    # Wrench-independent backstop: pause + resync if the QP model outruns the
    # real arm by this much. 60% of the bridge's model_real_gate (0.05 rad),
    # so it fires before the gate does - past the gate the bridge stops
    # publishing and the arm cannot recover without a restart.
    divergence_pause: 0.03
    clear_hold_time: 0.3
    next: HoldCurrent
    
    gains:
      mass:
        linear:  [3, 3, 3]
        angular: [2, 2, 2]
      stiffness:
        linear:  [100, 100, 100]
        angular: [10, 10, 10]
      damping:
        linear:  [60, 60, 60]
        angular: [15, 15, 15]

 
  # ── CARRY WRIST ANGLE (2026-10-21) ───────────────────────────────────
  # joint_6 is now -1.4534 rad everywhere the arm CARRIES the container,
  # replacing the per-pose captures (0.0948 ... 0.2321). It was set by
  # hand on the arm and read off /joint_states during a far2 run. The
  # captures had drifted apart by up to 7.8 deg; they are unified on one
  # value so the presentation is identical across conditions, since
  # distance and speed are the only factors meant to vary.
  #
  # Applied to, in all three chains:
  #     start_*        start_*_end        (joint targets)
  #     step_1*        step_2*_return     (joint targets)
  #     step_2*        step_1*_return     (Cartesian - see below)
  # NOT applied to unload_1 / unload_far1 / unload_far2: those keep their
  # captured ABSOLUTE angles, so the tool orientation at the tip instant
  # is bit-for-bit what it always was.
  #
  # CARTESIAN STATES. step_2* and step_1*_return hold a tool pose, not
  # joints, so the new angle goes in as the FK of the same joints with
  # joint_6 = -1.4534. joint_6 is the last joint and tool_frame sits on
  # its axis, so this is a pure roll: translation is unchanged to 0.0000
  # mm and only the YAW term of the rotation moves. The old values were
  # re-derived first and matched what was stored to 0.036-0.062 mm, which
  # is what confirms the joint sets quoted in the comments below are the
  # right ones. Yaw now lands near +/-pi; the sign differs between states
  # only because that is the branch FK returns, and +pi == -pi once
  # poseFromConfig builds the matrix.
  #
  # CONSEQUENCE - A LONGER UNLOAD ROLL. The roll is now taken against the
  # new carry angle, so unload is a 165-172 deg roll instead of 75.9 deg.
  # Its speed is handled separately: the six roll states run at a fixed
  # 0.14 rad/s in every trial, ~40 s per roll - see the wrist-roll-speed
  # note above unload_1.
  #
  # The compliant step_1 <-> step_2 legs are NOT affected: rolling both
  # ends about the tool axis is a similarity transform on the relative
  # rotation, so their orientation delta moves by <= 0.003 rad (< 0.4%)
  # and their duration is unchanged.
  #
  # The _end and _return states must carry the same value or the cycle
  # does not close: the arm would park at the old angle and re-roll on
  # every trial, which is the 25 s move this change removes.

  start_1:
    base: JointMove
    stiffness: 2.0
    v_max: 0.05
    # RE-CAPTURED 2026-10-14, container removed. Read directly off
    # /joint_states with the driver up and the mc_rtc bridge down, so no
    # dry-run and no risk of motion during capture. Previous value was
    #     [-2.9995, 0.0027, 2.4176, -0.0587, 0.6477, 0.1337]
    # joint_1 sits at -3.0312 rad (-173.7 deg), i.e. 6.3 deg from the
    # -pi wrap boundary, so every leg in or out of this pose crosses it.
    # That is handled (see angDiff and the reference wrapping in refAt()
    # in PickPlaceStates.cpp) but it is why those fixes are load-bearing
    # rather than defensive.
    target: [-3.0312, 0.1537, 2.3490, -0.1051, 0.9400, -1.4534]
    # "if the robot is not at the safe pose, go there" - skips instantly when
    # it already is, rather than holding a no-op reference for the full
    # duration. Same bar as `threshold` below.
    skip_if_within: 0.05
    duration: 15.0
    threshold: 0.05
    # Stall guard: freeze the interpolation clock and hold the model on
    # the encoders if the real arm falls this far behind, so a physically
    # blocked joint holds loudly instead of running the model past the
    # bridge's model_real_gate into an unrecoverable deadlock. See the
    # note on divergence_pause_ in PickPlaceStates.cpp (JointMove).
    divergence_pause: 0.03
    # First leg of the near chain, same shape as start_2/start_3 in the far
    # chains: the trial drives to its OWN start pose before anything else.
    next: step_1

  # ── NEW CYCLE, under construction 2026-10-12 ─────────────────────────
  # Target shape (poses captured live, one per dry run):
  #     start_1 -> step_1 -> step_2 -> unload_1 -> step_2 -> step_1 -> start_1
  # i.e. out through the steps, unload, then retrace the same poses back.
  #
  # NOTE ON THE RETRACE: mc_rtc keys transitions on (state, output), so a
  # state cannot appear twice in one chain with two different successors.
  # The return legs therefore need their own state entries carrying the SAME
  # target - step_2_return and step_1_return below - differing only in
  # `next`. They are duplicates on purpose, not an oversight.
  #
  # These states are defined but NOT yet referenced by `transitions:`, so
  # they are inert and the existing MoveToSafe -> ... -> MoveToSafe loop
  # still runs unchanged. Wiring happens in one pass once every pose is in.
  # STILL NEEDED: step_2, unload_1.

  step_1:
    base: JointMove
    stiffness: 2.0
    v_max: 0.05
    # Captured 2026-10-12 from init_q with the arm placed by hand.
    # RE-CAPTURED 2026-10-14 off /joint_states, container removed.
    target: [1.7412, 0.1194, 2.2088, -0.0599, 0.9549, -1.4534]
    duration: 15.0
    threshold: 0.05
    divergence_pause: 0.03
    next: step_2

  # unload_1 - tip the container by rolling the wrist. JointMove: it is a
  # single-joint motion with no meaningful Cartesian path.
  #
  # RE-CAPTURED 2026-10-14, container removed. Against step_2 the capture
  # differed on joint_6 by +1.3246 rad and on everything else by <= 0.0005
  # rad, i.e. encoder noise - so joints 1-5 are taken from step_2 VERBATIM
  # and only joint_6 is new. That keeps step_2 -> unload_1 -> step_2_return
  # exactly reversible with no drift accumulating round the cycle.
  #
  # 2026-10-21: joint_6 here is UNCHANGED (still the captured absolute
  # angle), but the carry angle it is reached from is now -1.4534, so the
  # roll itself is +2.9603 rad (169.6 deg) rather than +1.3246 (75.89).
  # The orientation at the tip instant is identical to before; only how
  # far the wrist travels to get there has changed.
  #
  # Geometry: a pure roll about the tool's own axis. The tool frame does
  # not translate at all (0.00 mm) and its z-axis tilt stays at 46.11 deg
  # from straight-down; only the roll changes, by 75.89 deg. Whether that
  # empties the container depends on how it sits in the gripper, which the
  # kinematics cannot predict - with the container refitted, if the Legos
  # do not come out, increase joint_6 further (the joint is continuous, so
  # there is no limit to work against).
  #
  # ── WRIST ROLL SPEED (2026-10-21) ────────────────────────────────────
  # The SIX states where joint_6 turns - the unload roll out and back:
  #     unload_1   unload_far1   unload_far2
  #     step_2_return   step_2_far1_return   step_2_far2_return
  # run at a FIXED 0.14 rad/s peak in every trial (`use_speed_scale:
  # false`), so slow/base/fast all unload identically. Each is a pure
  # joint_6 move (joints 1-5 equal at step_2 and unload), so this changes
  # the wrist and nothing else. Every other leg is untouched: v_max 0.05,
  # still scaled by the trial's speed_scale.
  #
  # Roll time, every trial: near 39.6 s, far1 38.6 s, far2 40.3 s.
  # (Was 111 / 56 / 22 s at slow/base/fast with v_max 0.10 scaled - and
  # the fast value never happened, see below.)
  #
  # WHY FIXED, AND WHY 0.14. Two ceilings, both measured live:
  #  1. The bridge. Each published command may lead the encoder by at
  #     most delta_max (0.006 rad), and joint_6 trails its command by
  #     ~34 ms, so no joint can sustain more than ~0.006/0.034 = 0.17 rad/s.
  #     far1_fast at v_max 0.10 asked for 0.25: the real wrist saturated at
  #     0.16-0.18 while the model kept going, model-vs-real climbed 0.0056
  #     -> 0.0451, and the runaway backstop froze the leg - stop-go.
  #     0.14 is the fastest speed that log shows tracking cleanly
  #     (commanded 0.1416, real 0.1410, 100%), needing a 0.0048 lead -
  #     1.26x under the clamp.
  #  2. The stall guard. Its "lag" is mostly the posture task's own
  #     following error (position target only, no velocity feedforward, so
  #     ~1.41 s * velocity at stiffness 2.0). Simulated against the
  #     far1_fast log - stall length 2.73 vs 2.77 s, post-resume lag within
  #     0.002 rad at all seven logged points - peak lag at 0.14 rad/s is
  #     0.197. stall_lag_enter 0.25 gives 0 stalls at 1.27x, the same
  #     margin every other JointMove leg runs on (0.18 stalled 3x/roll).
  #     With use_speed_scale false the threshold is NOT multiplied by the
  #     trial scale - JointMove::scale() feeds both the duration and this
  #     threshold, so they cannot disagree. The 0.045 model-runaway
  #     backstop is unchanged and still sits under the bridge's 0.05 gate.
  #
  # If these legs ever brake again, the log names the branch:
  #     STALLED (arm behind)    -> stall_lag_enter; raising it is safe,
  #                                the 0.045 backstop still catches a
  #                                genuinely blocked wrist
  #     STALLED (model runaway) -> the bridge ceiling; lower v_max (e.g.
  #                                with the container loaded, if the wrist
  #                                responds slower than 34 ms)
  unload_1:
    base: JointMove
    stiffness: 2.0
    v_max: 0.14   # rad/s peak, FIXED in every trial - see the wrist-speed note above unload_1
    use_speed_scale: false   # unload roll ignores slow/base/fast
    target: [1.7412, -0.8973, 1.4013, -0.0604, 0.0383, 1.5069]  # = step_2 + joint_6 roll
    duration: 15.0
    threshold: 0.05
    divergence_pause: 0.03
    stall_lag_enter: 0.25   # sized for 0.14 rad/s at scale 1.0 - see the wrist-speed note above unload_1
    next: step_2_return   # defined once the new plan lands

  # step_2 - THE PARTICIPANT-FACING LEG. Cartesian + compliant on purpose:
  # this is the only state whose path can be reshaped per trial condition
  # (near/far) and the only one that yields when a participant pushes it.
  #
  # Cartesian target derived from the captured joint pose
  #     [1.7412, -0.8973, 1.4013, -0.0604, 0.0383, -1.4534]   (j6 2026-10-21)
  # by forward kinematics off src/kinova_6dof.urdf. The FK was validated
  # against the four (joints -> real tool_frame) pairs already recorded in
  # snapshots/ - translation agreed to 0.03-0.08 mm on all four, and the
  # rotation convention was confirmed by matrix reconstruction rather than
  # by comparing Euler triples (which is branch-ambiguous past |pitch|>pi/2
  # and has bitten this file before). Reconstruction residual here was
  # 6e-16, i.e. exact.
  # GEOMETRY (re-measured 2026-10-14): translation 0.4619 m, rotation
  # 0.7081 rad (40.6 deg). The ANGULAR term binds at every speed_scale
  # (26.6 s vs 17.3 s at 1.0, a 54% margin), which is the property the
  # near/far design needs: moving the endpoint changes the distance but
  # NOT the orientation delta, so the leg's duration stays constant across
  # distance conditions and distance does not get confounded with
  # time-spent-near-participant. The previous geometry was linear-limited
  # by only 21% and did confound them.
  # joint_1 is identical at step_1 and step_2 (1.7412), so this leg
  # involves no base rotation and never crosses the +/-pi branch cut.
  step_2:
    base: ComplianceCartesianMove
    target:
      translation: [0.1156, 0.6659, 0.2153]
      rotation:    [2.3439, -0.1202, 3.0799]
    waypoints: []   # EXPERIMENT KNOB - proximity to participant
    duration: 4.0   # MINIMUM only
    v_max_lin: 0.05 # EXPERIMENT KNOB - m/s
    v_max_ang: 0.05 # EXPERIMENT KNOB - rad/s
    stiffness: 25.0
    damping: 12.0
    weight: 100.0
    # SENSITIVITY RAISED 2026-10-14. Previously 8.0 N / 0.03 rad, which made
    # a deliberate shove necessary to trip the pause.
    # Measured noise floors with the container removed (worst case over a
    # full cycle, from the RAW wrench and model-vs-real log lines):
    #     force           0.49 N      <- bridge deadband already blocks <1.0
    #     moment          0.68 Nm     <- bridge deadband already blocks <1.5
    #     model-vs-real   0.0016 rad
    # The bridge's deadband is what rejects noise; anything reaching this
    # state is already real signal, so an 8 N threshold on top of a 1 N
    # deadband bought nothing but required force. 2.0 N keeps 4x margin over
    # the worst noise and is 4x easier to trigger.
    # contact_moment_threshold stays at 2.0: the 1.5 Nm deadband dominates
    # it, so lowering it would have little effect without also lowering the
    # deadband (which lives in the bridge and is shared with
    # impedance_control).
    contact_force_threshold: 2.0   # must stay above deadband_force (1.0) on the bridge
    contact_moment_threshold: 2.0
    contact_moment_speed_gain: 0.0
    # 0.03 -> 0.010: purely kinematic, needs no wrench at all. Normal
    # model-vs-real is 0.0016, so this keeps ~6x margin while needing
    # only 0.57 deg of hold-back instead of 1.7 deg.
    divergence_pause: 0.010
    clear_hold_time: 0.3
    settle_timeout: 8.0
    next: unload_1
    gains:
      mass:
        linear:  [3, 3, 3]
        angular: [2, 2, 2]
      stiffness:
        linear:  [100, 100, 100]
        angular: [10, 10, 10]
      damping:
        linear:  [60, 60, 60]
        angular: [15, 15, 15]

  # step_1_return - the inbound half of the step_1 <-> step_2 traverse, so
  # also compliant Cartesian. Same physical pose as step_1, but reached as a
  # Cartesian target rather than a joint target, so the QP may settle on a
  # slightly different joint solution; start_1 (JointMove) afterwards pins
  # the configuration exactly.
  # step_2_return - back to the step_2 pose after tipping. JointMove: only
  # the OUTBOUND step_1 -> step_2 leg is compliant (confirmed 2026-10-12).
  # Same physical pose as step_2, expressed as the captured joints so the
  # arm returns to exactly the configuration it left.
  step_2_return:
    base: JointMove
    stiffness: 2.0
    v_max: 0.14   # rad/s peak, FIXED in every trial - see the wrist-speed note above unload_1
    use_speed_scale: false   # unload roll ignores slow/base/fast
    target: [1.7412, -0.8973, 1.4013, -0.0604, 0.0383, -1.4534]  # = step_2
    duration: 15.0
    threshold: 0.05
    divergence_pause: 0.03
    stall_lag_enter: 0.25   # sized for 0.14 rad/s at scale 1.0 - see the wrist-speed note above unload_1
    next: step_1_return

  # step_1_return - the INBOUND half of the step_1 <-> step_2 traverse, so
  # compliant Cartesian like step_2 (2026-10-12). Both directions of the
  # participant-facing traverse yield on contact; everything else in the
  # cycle is JointMove.
  #
  # Same physical pose as step_1, but reached as a Cartesian target rather
  # than a joint target, so the QP may settle on a slightly different joint
  # solution than the capture. start_1 (JointMove) immediately afterwards
  # pins the configuration exactly, so that does not accumulate.
  #
  # Cartesian pose from FK on the captured step_1 joints
  #     [1.7412, 0.1194, 2.2088, -0.0599, 0.9549, -1.4534]   (j6 2026-10-21)
  # FK re-validated 2026-10-14 against the four (joints -> real tool_frame)
  # pairs in snapshots/: worst translation error 0.081 mm. Reconstruction
  # residual here 4e-16.
  step_1_return:
    base: ComplianceCartesianMove
    target:
      translation: [0.0341, 0.2382, 0.3696]
      rotation:    [3.0366, 0.0316, 3.0547]
    waypoints: []   # keep [] - see the via-point stop warning in trials:
    duration: 4.0   # MINIMUM only
    v_max_lin: 0.05
    v_max_ang: 0.05
    stiffness: 25.0
    damping: 12.0
    weight: 100.0
    # SENSITIVITY RAISED 2026-10-14. Previously 8.0 N / 0.03 rad, which made
    # a deliberate shove necessary to trip the pause.
    # Measured noise floors with the container removed (worst case over a
    # full cycle, from the RAW wrench and model-vs-real log lines):
    #     force           0.49 N      <- bridge deadband already blocks <1.0
    #     moment          0.68 Nm     <- bridge deadband already blocks <1.5
    #     model-vs-real   0.0016 rad
    # The bridge's deadband is what rejects noise; anything reaching this
    # state is already real signal, so an 8 N threshold on top of a 1 N
    # deadband bought nothing but required force. 2.0 N keeps 4x margin over
    # the worst noise and is 4x easier to trigger.
    # contact_moment_threshold stays at 2.0: the 1.5 Nm deadband dominates
    # it, so lowering it would have little effect without also lowering the
    # deadband (which lives in the bridge and is shared with
    # impedance_control).
    contact_force_threshold: 2.0   # must stay above deadband_force (1.0) on the bridge
    contact_moment_threshold: 2.0
    contact_moment_speed_gain: 0.0
    # 0.03 -> 0.010: purely kinematic, needs no wrench at all. Normal
    # model-vs-real is 0.0016, so this keeps ~6x margin while needing
    # only 0.57 deg of hold-back instead of 1.7 deg.
    divergence_pause: 0.010
    clear_hold_time: 0.3
    settle_timeout: 8.0
    next: start_1_end
    gains:
      mass:
        linear:  [3, 3, 3]
        angular: [2, 2, 2]
      stiffness:
        linear:  [100, 100, 100]
        angular: [10, 10, 10]
      damping:
        linear:  [60, 60, 60]
        angular: [15, 15, 15]


  # start_1_end - near's return-to-start. Separate state from start_1 for the
  # same reason start_2_end/start_3_end are: mc_rtc keys transitions on
  # (state, output), so a state cannot both begin and end a chain.
  start_1_end:
    base: JointMove
    stiffness: 2.0
    v_max: 0.05
    target: [-3.0312, 0.1537, 2.3490, -0.1051, 0.9400, -1.4534]   # = start_1
    duration: 15.0
    threshold: 0.05
    divergence_pause: 0.03
    next: TrialGate

  # ═══════════════════════════════════════════════════════════════════
  #  far1 CHAIN (2026-10-14) - a SEPARATE set of states, not overrides
  # ═══════════════════════════════════════════════════════════════════
  # far1 needs its own start pose, and a start state that runs BEFORE the
  # trial gate cannot know which trial is coming. Rather than contort the
  # shared chain, far1 owns its poses outright and TrialGate routes into
  # this chain via `entry: start_2` in the trials: block. The near chain
  # above is byte-identical to what it was.
  #
  # Yes, this duplicates structure. Deliberate, for now: it keeps the two
  # conditions independent so a change to one cannot silently alter the
  # other. If a third condition appears, revisit.
  #
  #   TrialGate -> start_2 -> step_1_far1 -> step_2_far1 -> unload_far1
  #             -> step_2_far1_return -> step_1_far1_return -> start_2_end
  #             -> TrialGate
  #
  # Compliant legs: step_2_far1 and step_1_far1_return (the step_1<->step_2
  # traverse, both directions), matching near.
  start_2:
    base: JointMove
    stiffness: 2.0
    v_max: 0.05
    target: [-3.0683, -0.2699, 1.8801, -0.0026, 0.9525, -1.4534]
    # goes here from wherever the arm is; skips if already within
    skip_if_within: 0.05
    duration: 15.0
    threshold: 0.05
    divergence_pause: 0.03
    next: step_1_far1
  step_1_far1:
    base: JointMove
    stiffness: 2.0
    v_max: 0.05
    target: [1.6522, -0.2699, 1.8801, -0.0026, 0.9525, -1.4534]
    duration: 15.0
    threshold: 0.05
    divergence_pause: 0.03
    next: step_2_far1
  step_2_far1:
    base: ComplianceCartesianMove
    target:
      translation: [0.1716, 0.6640, 0.2160]
      rotation:    [2.3900, -0.1685, 3.0296]
    waypoints: []
    duration: 4.0
    v_max_lin: 0.05
    v_max_ang: 0.05
    stiffness: 25.0
    damping: 12.0
    weight: 100.0
    contact_force_threshold: 2.0
    contact_moment_threshold: 2.0
    contact_moment_speed_gain: 0.0
    divergence_pause: 0.010
    clear_hold_time: 0.3
    settle_timeout: 8.0
    next: unload_far1
    gains:
      mass:      {linear: [3, 3, 3],       angular: [2, 2, 2]}
      stiffness: {linear: [100, 100, 100], angular: [10, 10, 10]}
      damping:   {linear: [60, 60, 60],    angular: [15, 15, 15]}
  unload_far1:
    base: JointMove
    stiffness: 2.0
    v_max: 0.14   # rad/s peak, FIXED in every trial - see the wrist-speed note above unload_1
    use_speed_scale: false   # unload roll ignores slow/base/fast
    target: [1.8232, -0.9163, 1.3348, -0.0463, 0.1240, 1.4303]
    # joint_6 unchanged from the capture; reached from the -1.4534 carry
    # angle it is now a +2.8837 rad (165.2 deg) roll, as near's unload_1
    duration: 15.0
    threshold: 0.05
    divergence_pause: 0.03
    stall_lag_enter: 0.25   # sized for 0.14 rad/s at scale 1.0 - see the wrist-speed note above unload_1
    next: step_2_far1_return
  step_2_far1_return:
    base: JointMove
    stiffness: 2.0
    v_max: 0.14   # rad/s peak, FIXED in every trial - see the wrist-speed note above unload_1
    use_speed_scale: false   # unload roll ignores slow/base/fast
    target: [1.8232, -0.9163, 1.3348, -0.0463, 0.1240, -1.4534]
    # = step_2_far1's joints
    duration: 15.0
    threshold: 0.05
    divergence_pause: 0.03
    stall_lag_enter: 0.25   # sized for 0.14 rad/s at scale 1.0 - see the wrist-speed note above unload_1
    next: step_1_far1_return
  step_1_far1_return:
    base: ComplianceCartesianMove
    target:
      translation: [0.0318, 0.3776, 0.3406]
      rotation:    [3.1025, -0.0011, -3.1070]
    waypoints: []
    duration: 4.0
    v_max_lin: 0.05
    v_max_ang: 0.05
    stiffness: 25.0
    damping: 12.0
    weight: 100.0
    contact_force_threshold: 2.0
    contact_moment_threshold: 2.0
    contact_moment_speed_gain: 0.0
    divergence_pause: 0.010
    clear_hold_time: 0.3
    settle_timeout: 8.0
    next: start_2_end
    gains:
      mass:      {linear: [3, 3, 3],       angular: [2, 2, 2]}
      stiffness: {linear: [100, 100, 100], angular: [10, 10, 10]}
      damping:   {linear: [60, 60, 60],    angular: [15, 15, 15]}
  start_2_end:
    base: JointMove
    stiffness: 2.0
    v_max: 0.05
    target: [-3.0683, -0.2699, 1.8801, -0.0026, 0.9525, -1.4534]
    # same pose as start_2; separate state because mc_rtc keys
    # transitions on (state, output) and this one returns to the gate
    duration: 15.0
    threshold: 0.05
    divergence_pause: 0.03
    next: TrialGate


  # ═══════════════════════════════════════════════════════════════════
  #  far2 CHAIN (2026-10-14) - third distance condition, same shape
  # ═══════════════════════════════════════════════════════════════════
  #   TrialGate -> start_3 -> step_1_far2 -> step_2_far2 -> unload_far2
  #             -> step_2_far2_return -> step_1_far2_return -> start_3_end
  #             -> TrialGate
  #
  # Start-pose reach across the three conditions: 0.194 / 0.379 / 0.548 m.
  # step_2 reach: 0.676 / 0.686 / 0.696 m - the endpoints stay close
  # together while the start and staging poses spread out. See the geometry
  # note in the trials: block.
  #
  # NOTE step_1_far2 is kept EXACTLY as captured rather than snapped to
  # start_3's joints the way step_1_far1 was. Its joints 2-5 differ from
  # start_3 by 3.6-6.2 deg, which is worth 66 mm and 7.5 deg at the tool -
  # a real pose (it sits 64 mm lower), not capture drift. far1's equivalent
  # deltas were 0.0003 rad, where snapping cost nothing.
  start_3:
    base: JointMove
    stiffness: 2.0
    v_max: 0.05
    target: [-3.0314, -0.5614, 1.4110, -0.1049, 0.9267, -1.4534]
    # goes here from wherever the arm is; skips if already within
    skip_if_within: 0.05
    duration: 15.0
    threshold: 0.05
    divergence_pause: 0.03
    next: step_1_far2
  step_1_far2:
    base: JointMove
    stiffness: 2.0
    v_max: 0.05
    target: [1.6243, -0.6464, 1.4741, 0.0037, 0.8512, -1.4534]
    # as captured - see the note above about NOT snapping this one
    duration: 15.0
    threshold: 0.05
    divergence_pause: 0.03
    next: step_2_far2
  step_2_far2:
    base: ComplianceCartesianMove
    target:
      translation: [0.2099, 0.6641, 0.2188]
      rotation:    [2.4535, -0.2043, 3.0621]
    waypoints: []
    duration: 4.0
    v_max_lin: 0.05
    v_max_ang: 0.05
    stiffness: 25.0
    damping: 12.0
    weight: 100.0
    contact_force_threshold: 2.0
    contact_moment_threshold: 2.0
    contact_moment_speed_gain: 0.0
    divergence_pause: 0.010
    clear_hold_time: 0.3
    settle_timeout: 8.0
    next: unload_far2
    gains:
      mass:      {linear: [3, 3, 3],       angular: [2, 2, 2]}
      stiffness: {linear: [100, 100, 100], angular: [10, 10, 10]}
      damping:   {linear: [60, 60, 60],    angular: [15, 15, 15]}
  unload_far2:
    base: JointMove
    stiffness: 2.0
    v_max: 0.14   # rad/s peak, FIXED in every trial - see the wrist-speed note above unload_1
    use_speed_scale: false   # unload roll ignores slow/base/fast
    target: [1.8730, -0.9377, 1.2502, 0.0361, 0.2409, 1.5556]
    # joint_6 unchanged from the capture; reached from the -1.4534 carry
    # angle it is now a +3.0090 rad (172.4 deg) roll, as near and far1
    duration: 15.0
    threshold: 0.05
    divergence_pause: 0.03
    stall_lag_enter: 0.25   # sized for 0.14 rad/s at scale 1.0 - see the wrist-speed note above unload_1
    next: step_2_far2_return
  step_2_far2_return:
    base: JointMove
    stiffness: 2.0
    v_max: 0.14   # rad/s peak, FIXED in every trial - see the wrist-speed note above unload_1
    use_speed_scale: false   # unload roll ignores slow/base/fast
    target: [1.8730, -0.9377, 1.2502, 0.0361, 0.2409, -1.4534]
    # = step_2_far2's joints
    duration: 15.0
    threshold: 0.05
    divergence_pause: 0.03
    stall_lag_enter: 0.25   # sized for 0.14 rad/s at scale 1.0 - see the wrist-speed note above unload_1
    next: step_1_far2_return
  step_1_far2_return:
    base: ComplianceCartesianMove
    target:
      translation: [0.0309, 0.5424, 0.2828]
      rotation:    [2.9721, -0.0118, -3.0745]
    waypoints: []
    duration: 4.0
    v_max_lin: 0.05
    v_max_ang: 0.05
    stiffness: 25.0
    damping: 12.0
    weight: 100.0
    contact_force_threshold: 2.0
    contact_moment_threshold: 2.0
    contact_moment_speed_gain: 0.0
    divergence_pause: 0.010
    clear_hold_time: 0.3
    settle_timeout: 8.0
    next: start_3_end
    gains:
      mass:      {linear: [3, 3, 3],       angular: [2, 2, 2]}
      stiffness: {linear: [100, 100, 100], angular: [10, 10, 10]}
      damping:   {linear: [60, 60, 60],    angular: [15, 15, 15]}
  start_3_end:
    base: JointMove
    stiffness: 2.0
    v_max: 0.05
    target: [-3.0314, -0.5614, 1.4110, -0.1049, 0.9267, -1.4534]
    # same pose as start_3; separate state because mc_rtc keys
    # transitions on (state, output)
    duration: 15.0
    threshold: 0.05
    divergence_pause: 0.03
    next: TrialGate

  # ── Trial gate ───────────────────────────────────────────────────────
  # The arm parks at start_1 and waits here for a trial name on
  # /trial_config before running a cycle. See the trials: block at the top.
  TrialGate:
    base: Idle
    # Fallback only - every trial names an `entry:`, so this is unreachable
    # in practice. Points at a start pose rather than mid-chain so that a
    # profile missing its `entry:` still begins somewhere sane.
    next: start_1

transitions:
  - [HoldCurrent,  HoldCurrent,  HoldCurrent,  Auto]   # standalone impedance hold, not in the cycle
  # ── The cycle (rebuilt 2026-10-12) ───────────────────────────────────
  #   start_1        go to the start pose from wherever the arm is
  #                  (skips instantly if already within skip_if_within)
  #   TrialGate      park and wait for a trial name on /trial_config
  #   step_1         joint-space move out
  #   step_2         COMPLIANT Cartesian traverse  [participant-facing]
  #   unload_1       tip the container
  #   step_2_return  back to step_2's pose   (JointMove)
  #   step_1_return  back to step_1's pose   (JointMove)
  #   -> start_1, park, wait for the next trial
  #
  # Only step_2 is compliant: it is the one leg a participant is near, and
  # the only one whose endpoint/path the trial profiles reshape.
  - [TrialGate,      start_1,        start_1,        Auto]   # released by /trial_config
  - [start_1,        step_1,         step_1,         Auto]
  - [step_1,         step_2,         step_2,         Auto]
  - [step_2,         unload_1,       unload_1,       Auto]
  - [unload_1,       step_2_return,  step_2_return,  Auto]
  - [step_2_return,  step_1_return,  step_1_return,  Auto]
  - [step_1_return,  start_1_end,    start_1_end,    Auto]
  - [start_1_end,    TrialGate,      TrialGate,      Auto]
  # ── far1 chain (entered from TrialGate via `entry: start_2`) ─────────
  - [TrialGate,          start_2,            start_2,            Auto]
  - [start_2,            step_1_far1,        step_1_far1,        Auto]
  - [step_1_far1,        step_2_far1,        step_2_far1,        Auto]
