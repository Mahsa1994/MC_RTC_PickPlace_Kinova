MainRobot: Kinova6DOF
ControllerName: PickPlaceController
z_min_limit: 0.15

home_pose:
  translation: [0.287, 0.175, 0.392]
  rotation: [3.0087, 0.0020, 1.7769]

pick_pose:
  translation: [0.40, 0.10, 0.15]
  rotation:    [3.1416, 0.0, 0.0]

place_pose:
  translation: [0.35, -0.10, 0.15]
  rotation:    [3.1416, 0.0, 0.0]

StatesLibraries:
  - /home/vscode/workspace/install/pick_and_place/lib/mc_states

StatesFiles: []
IdleKeepState: true
# SAFETY SCOPE (temporary): hold-in-place push/release test only. Does not
# move toward Unfold/MoveHome/pick/place at all - captures wherever the arm
# physically is at startup as the compliance target and holds there. See
# HoldCurrent below. To restore the full sequence starting from Unfold, set
# this back to `init: Unfold`.
init: HoldCurrent

states:

  # Push/release sanity check: capture the arm's current pose as the
  # ImpedanceTask target and hold it there (duration is a long fixed
  # ceiling, not an actual move - target == start pose, so there is no
  # motion to converge to). Push the arm -> it should yield; release ->
  # it should settle back toward this same captured pose. Ctrl+C the
  # bridge when done; there's no natural exit from this state.
  HoldCurrent:
    base: ComplianceCartesianMove
    target:
      ref: current
    waypoints: []
    duration: 3600.0
    stiffness: 25.0
    damping: 12.0
    weight: 100.0
    contact_force_threshold: 8.0   # must stay above deadband_force on the bridge
    clear_hold_time: 0.3
    next: HoldCurrent

  # Arm is expected to start at the monitoring snapshot pose:
  #   joints (deg): [119.6, 0.5, 87.9, 174.3, 263.6, 87.9]
  # Target is the SAME pose converted to radians — so the arm should
  # barely move. This confirms joint naming and direction are correct
  # before commanding any real motion, before chaining into the full
  # pick-and-place cycle below.
  Unfold:
    base: JointMove
    #target: [-0.6933, 0.0449, -1.4642, 3.0964, 1.5793, -1.3926]
    target: [-0.5649, -0.0336, -1.6628, -3.1074, 1.3932, -1.9451]
    duration: 15.0      # very slow — 15 s to move essentially nowhere
    stiffness: 50.0      # minimal gain — arm will move gently
    threshold: 0.05     # 0.05 rad (~3°) convergence threshold
    next: MoveHome

  # Rigid (non-compliant) - fine here since this runs before/after the task,
  # not while a human is expected to be reaching into the workspace.
  MoveHome:
    base: CartesianMove
    target:
      ref: home
    duration: 15.0
    stiffness: 4.0
    weight: 1000.0
    pos_threshold: 0.02
    settle_timeout: 5.0
    next: MoveToPick

  # ── Pick-and-place cycle ─────────────────────────────────────────────
  # MoveToPick and MoveToPlace are ComplianceCartesianMove: they yield if
  # the human pushes the arm off its path (trajectory clock pauses until
  # the wrench clears), then resume toward the same target. MoveToPlace is
  # the experimentally-relevant leg - `waypoints` sets the trajectory shape
  # and `duration` sets the average speed, both changeable here without
  # recompiling for different HRI trial conditions.
  # SAFETY SCOPE (temporary): MoveToPick is the only compliance behavior
  # under test right now - it stops at Idle instead of continuing into
  # CloseGripper/MoveToPlace/OpenGripper/ReturnHome, so a real-hardware run
  # only ever exercises one ComplianceCartesianMove and never actuates the
  # gripper or drives toward `place`. To restore the full pick-and-place
  # loop: set this back to `next: CloseGripper`, uncomment the states below,
  # and restore the full transitions table (both preserved below).
  MoveToPick:
    base: ComplianceCartesianMove
    target:
      ref: pick
    waypoints:
      - [0.40, 0.10, 0.25]   # hover ~10cm above pick_pose before descending
    duration: 4.0
    stiffness: 25.0
    damping: 12.0
    weight: 100.0
    contact_force_threshold: 8.0   # must stay above deadband_force on the bridge
    clear_hold_time: 0.3
    next: Idle

  # -- disabled for now, see SAFETY SCOPE note above --
  # CloseGripper:
  #   base: Gripper
  #   action: close
  #   timeout: 2.0
  #   next: MoveToPlace

  # THE experiment-manipulation state: vary `waypoints` for trajectory shape
  # and `duration` for velocity between trials.
  # MoveToPlace:
  #   base: ComplianceCartesianMove
  #   target:
  #     ref: place
  #   waypoints: []   # add via-points here to change the trajectory shape
  #   duration: 5.0    # shorten/lengthen to change arm velocity
  #   stiffness: 20.0
  #   damping: 10.0
  #   weight: 100.0
  #   contact_force_threshold: 8.0
  #   clear_hold_time: 0.3
  #   next: OpenGripper

  # OpenGripper:
  #   base: Gripper
  #   action: open
  #   timeout: 3.0
  #   next: ReturnHome

  # ReturnHome:
  #   base: CartesianMove
  #   target:
  #     ref: home
  #   duration: 4.0
  #   stiffness: 4.0
  #   weight: 1000.0
  #   pos_threshold: 0.02
  #   settle_timeout: 5.0
  #   next: Idle

transitions:
  - [HoldCurrent,  HoldCurrent,  HoldCurrent,  Auto]
  - [Unfold,       MoveHome,     MoveHome,     Auto]
  - [MoveHome,     MoveToPick,   MoveToPick,   Auto]
  - [MoveToPick,   Idle,         Idle,         Auto]
  # -- full pick-and-place loop, disabled for now, see SAFETY SCOPE note above --
  # - [MoveToPick,   CloseGripper, CloseGripper, Auto]
  # - [CloseGripper, MoveToPlace,  MoveToPlace,  Auto]
  # - [MoveToPlace,  OpenGripper,  OpenGripper,  Auto]
  # - [OpenGripper,  ReturnHome,   ReturnHome,   Auto]
  # - [ReturnHome,   Idle,         Idle,         Auto]
constraints:
  - type: kinematics
  - type: dynamics
    damper: [0.1, 0.01, 0.5]
  - type: collision
    r1: kinova_6dof
    r2: kinova_6dof
    collisions:
      - type: all
        iDist: 0.15
        sDist: 0.05
        damping: 0.0
