MainRobot: Kinova6DOF
ControllerName: PickPlaceController
z_min_limit: 0.15

home_pose:
  # SAFETY INCIDENT 2026-08-19: this pose was wrong - off by ~33cm in
  # translation and ~82 deg in orientation from the arm's actual physical
  # Home position. First fix attempt (2026-08-19) used the Kinova web app's
  # own reported EE translation (Monitoring_2026-08-19_4-10-15.json),
  # assumed to correspond 1:1 to mc_rtc's tool_frame - WRONG (see below).
  #
  # CORRECTED 2026-08-24, superseding that attempt: with the arm physically
  # at Kinova's real Home (confirmed by the operator), CartesianMove::start()
  # logged mc_rtc's OWN tool_frame forward kinematics directly:
  #   from: [+0.454, +0.001, +0.423]
  #   from rotation [roll,pitch,yaw] (deg): [+173.42, -89.98, +96.58]
  # This is the same eulerAngles(2,1,0) decomposition poseFromConfig()
  # recomposes from `rotation: [roll,pitch,yaw]`, so it drops straight in
  # with no convention translation. It does NOT match the web-app-derived
  # values above (translation off by ~11.8cm in X; rotation's pitch is
  # -89.98 deg here vs +0.11 deg from the web-app-derived value - a
  # different orientation regime entirely, not a small error) - the web
  # app's reported EE pose evidently uses a different reference point
  # along the tool than mc_rtc's `tool_frame` (TCP vs flange or similar),
  # so copying its numbers directly was never valid. This is now a direct
  # mc_rtc-native measurement, not a cross-convention guess - retest MoveHome
  # in dry-run first to confirm pos_err/ori_err shrink close to zero from
  # this pose before trusting it live.
  translation: [0.454, 0.001, 0.423]
  rotation: [3.0267, -1.5704, 1.6856]

pick_pose:
  # SET 2026-08-26: was a never-tested placeholder guess. Replaced with a
  # direct mc_rtc-native reading (same method as home_pose above) -
  # physically jogged the arm to this pose, then read MoveHome's
  # `real tool_frame translation:`/`rotation:` startup log with the arm
  # sitting there. Confirmed via dry-run: no "QP failed to run()" computing
  # a MoveHome trajectory away from this pose (earlier candidate poses hit
  # that error - see README problem 15/17 - most likely self-collision on
  # a specific joint combination, not simply "how far is home"). NOT yet
  # live-tested - MoveToPick (ComplianceCartesianMove) has never been
  # validated live, only MoveHome's dry-run reachability from here.
  translation: [0.2354, -0.2139, 0.3628]
  rotation:    [-3.0885, -0.0668, 0.8662]

place_pose:
  translation: [0.35, -0.10, 0.15]
  rotation:    [3.1416, 0.0, 0.0]

StatesLibraries:
  - /home/vscode/workspace/install/pick_and_place/lib/mc_states

StatesFiles: []
IdleKeepState: true
# Full pick-and-place loop restored (2026-08-19) after HoldCurrent's
# translational sign check + gain tuning passed live, and after the
# joint_trajectory_controller nonzero-end-velocity fix. Safety scope for this
# is "participants only ever contact the gripper/end-effector area" (chosen
# deliberately over whole-arm contact safety, which this architecture does
# not provide - see MoveToPick/MoveToPlace comments below).
# Unfold removed (2026-08-19) - pipeline now starts directly at MoveHome.
# Unfold's job was a small joint-space move to a known-consistent starting
# configuration before the Cartesian legs began; skipping it means MoveHome's
# BSpline path to home_pose now starts from wherever the arm actually is,
# which is only as safe as that starting pose is reasonable (no known issue
# observed, but this was Unfold's whole reason for existing - if MoveHome
# ever takes a surprising path, this is the first thing to reconsider).
# Definition preserved, commented out, below - re-enable by setting this back
# to `init: Unfold` and uncommenting its state + transition.
#
# DIAGNOSTIC BYPASS REVERTED (2026-08-26): was temporarily MoveToPick, to
# dry-run-test its startup in isolation (passed cleanly - no
# "QP failed to run()", SIGN CHECK converged smoothly toward pick_pose,
# FORCED ADVANCE and ReturnHome's resync both fired correctly - see README).
init: MoveHome

states:

  # Push/release sanity check: capture the arm's current pose as the
  # ImpedanceTask target and hold it there (duration is a long fixed
  # ceiling, not an actual move - target == start pose, so there is no
  # motion to converge to). Push the arm -> it should yield; release ->
  # it should settle back toward this same captured pose. Ctrl+C the
  # bridge when done; there's no natural exit from this state.
  HoldCurrent:
    base: ComplianceCartesianMove
    target:
      ref: current
    waypoints: []
    duration: 3600.0
    stiffness: 25.0
    damping: 12.0
    weight: 100.0
    contact_force_threshold: 8.0   # must stay above deadband_force on the bridge
    clear_hold_time: 0.3
    next: HoldCurrent
    # Softened after live test felt too rigid (defaults: stiffness 800 N/m /
    # 40 Nm/rad meant deflection = force/800 - a 1N push only earned ~1.25mm).
    # 4x softer here (kept from the previous round).
    #
    # mass raised back from 1->2 (2026-08-19): mass=1 felt jerky at the start
    # of a push ("brake then go") - likely the virtual compliant target
    # responding faster than real joint static friction can break away,
    # getting ahead before the joint catches up. Splitting the difference
    # between the original default (3) and the too-eager value (1) reduced
    # that gap without giving back the stiffness softening.
    #
    # linear mass/stiffness/damping reverted to match impedance_control's
    # KinovaImpedance.yaml (2026-08-19): that config was already validated to
    # move well through the base/shoulder joints, not just the wrist - my
    # earlier linear stiffness (200) was 2x stiffer than its proven value
    # (100), which suppressed exactly the translational motion that would
    # recruit those joints. Angular left as-is (already softer than the old
    # config's 20, and rotation/wrist motion was already working fine - not
    # implicated in this complaint). UNTESTED live - retest before trusting it.
    gains:
      mass:
        linear:  [3, 3, 3]
        angular: [2, 2, 2]
      stiffness:
        linear:  [100, 100, 100]
        angular: [10, 10, 10]
      damping:
        linear:  [60, 60, 60]
        angular: [15, 15, 15]

  # -- Unfold, removed from the pipeline 2026-08-19, see note near `init:`
  # above. Target was last updated to match the arm's actual resting pose,
  # confirmed via encoder readings (FIRST CMD MISMATCH log) consistent
  # across every real-hardware test this session:
  #   joint_1=-2.936 joint_2=-0.034 joint_3=-1.827
  #   joint_4=-0.006 joint_5=-1.049 joint_6=-1.774
  # An earlier target assumed a different "monitoring snapshot pose" that
  # didn't match reality - joints 1/4/5 were off by ~130-140 deg, well past
  # the bridge's FIRST CMD MISMATCH safety gate, so Unfold could never
  # actually publish a command. If you re-enable this and park the arm
  # somewhere else first, update these values to match - the intent is a
  # small, safe move that confirms joint naming/direction, not a large jump.
  # Unfold:
  #   base: JointMove
  #   target: [-2.936, -0.034, -1.827, -0.006, -1.049, -1.774]
  #   duration: 15.0      # very slow — 15 s to move essentially nowhere
  #   stiffness: 50.0      # minimal gain — arm will move gently
  #   threshold: 0.05     # 0.05 rad (~3°) convergence threshold
  #   next: MoveHome

  # Rigid (non-compliant) - fine here since this runs before/after the task,
  # not while a human is expected to be reaching into the workspace.
  # ISOLATED VALIDATION (2026-08-19): next temporarily set to ReturnHome
  # instead of MoveToPick, to live-test the two rigid legs alone before
  # MoveToPick/MoveToPlace (which still fail dry-run for the confirmed
  # dry-run-only reason documented in the README - not live-validated yet).
  # Restore `next: MoveToPick` (and the transition below) once this passes.
  #
  # SWITCHED TO JOINT-SPACE 2026-08-24: dry-run from a realistic
  # "somewhat away from home" pose (reached via a mix of the Kinova app's
  # pose and angular jog controls - operator confirmed not an unusual
  # configuration) showed the Cartesian BSpline version stalling partway:
  # joint_4's model value decelerated smoothly to a dead stop while
  # pos_err/ori_err stayed clearly non-zero (0.0975m / 0.2661 rad).
  # joint_4 is `continuous` in the URDF (no position limit) and never
  # approached its velocity limit either, so this isn't the joint_5-hits-
  # its-limit issue from the previous test - more likely the QP-solved
  # Cartesian IK path routed through a configuration near the self-
  # collision constraint (iDist/sDist below) or a singularity. Direct
  # joint-space interpolation takes a different route through
  # configuration space to the exact same physical target, which may
  # avoid whatever intermediate configuration caused that. Target is the
  # real Home joint configuration, read directly from realRobot() in two
  # separate tests with the arm confirmed at Kinova's actual Home
  # (consistent between them to ~0.0002 rad). If this ALSO stalls the same
  # way from a similar starting pose, that's strong evidence of a genuine
  # self-collision/singularity the arm needs to route around, not just a
  # Cartesian-path artifact - see README. Old Cartesian version preserved
  # below, commented out, for comparison/revert.
  MoveHome:
    base: JointMove
    # PACING REWORKED 2026-08-26: the `stiffness: 0.05` approach tried
    # 2026-08-24 (lowering the posture task's spring gain 40x, estimating
    # ~0.14 rad/s peak) FAILED live - a real, non-trivial-distance test
    # showed the model still moving at ~0.4-0.9 rad/s (same order of
    # magnitude as the un-reduced default), tripping the bridge's
    # model_real_gate almost immediately and holding it blocked for the
    # entire test (safe - arm never moved at all - but zero progress).
    # Root cause left deliberately unresolved (either the stiffness-to-
    # velocity relationship assumed for that estimate was wrong, or the
    # value didn't take effect - same class of stale-build mismatch as an
    # earlier dry_run mixup this session) - JointMove was changed instead
    # to make peak velocity an explicit, guaranteed, directly-computed
    # property (quintic time-interpolation from the real start pose to
    # `target` over an auto-extending duration - see PickPlaceStates.cpp),
    # governed by `v_max` below rather than `stiffness`. `stiffness` is
    # restored to a normal TRACKING gain (how tightly the real posture
    # follows the now-slow, already-bounded reference) - it no longer
    # controls speed at all.
    stiffness: 2.0
    v_max: 0.05   # rad/s hard cap on any joint's peak velocity - keep well under delta_max's implied real-tracking ceiling (~0.2 rad/s @ delta_max=0.002, 100Hz)
    target: [0.0000, 0.2622, -2.2691, 0.0000, 0.9598, 1.5708]
    duration: 15.0   # now a MINIMUM - actual duration auto-extends per v_max for large moves, see start() log
    threshold: 0.05
    # ISOLATED VALIDATION BYPASS REVERTED (2026-08-26): live-confirmed from
    # a real, meaningful distance (max joint delta 0.62 rad) - clean
    # convergence in ~23s, model-vs-real deviation never exceeded ~0.002
    # rad, safety gate never fired, ReturnHome/Idle completed cleanly
    # afterward. Restoring the original MoveToPick target - MoveToPick
    # itself (ComplianceCartesianMove, moving-target compliance tracking)
    # has NOT been live-tested yet and should be validated in isolation
    # next, same staged philosophy as HoldCurrent/MoveHome before it.
    next: MoveToPick

  # MoveHome:
  #   base: CartesianMove
  #   target:
  #     ref: home
  #   duration: 15.0
  #   stiffness: 4.0
  #   weight: 1000.0
  #   pos_threshold: 0.02
  #   settle_timeout: 5.0
  #   next: ReturnHome

  # ── Pick-and-place cycle ─────────────────────────────────────────────
  # MoveToPick and MoveToPlace are ComplianceCartesianMove: they yield if
  # the human pushes the arm off its path (trajectory clock pauses until
  # the wrench clears), then resume toward the same target. MoveToPlace is
  # the experimentally-relevant leg - `waypoints` sets the trajectory shape
  # and `duration` sets the average speed, both changeable here without
  # recompiling for different HRI trial conditions.
  # Contact-safety scope: participants only ever contact the gripper/
  # end-effector area (chosen deliberately - this architecture's wrench
  # estimate is computed as-if applied at the tool frame, so contact
  # elsewhere on the arm's body yields inconsistently, see session notes
  # 2026-08-19). Gains matched to HoldCurrent's live-tuned values below.
  MoveToPick:
    base: ComplianceCartesianMove
    target:
      ref: pick
    # waypoint updated 2026-08-26 to match pick_pose's new value (was
    # [0.40, 0.10, 0.25], hovering over the OLD placeholder pick_pose -
    # stale and unrelated to the current pick_pose translation
    # [0.2354, -0.2139, 0.3628] below; left unfixed it would have sent the
    # arm to an arbitrary, unrelated point in the workspace first). Same
    # X/Y as pick_pose, +0.10 in Z to hover above it before descending.
    waypoints:
      - [0.2354, -0.2139, 0.4628]
    duration: 4.0
    stiffness: 25.0
    damping: 12.0
    weight: 100.0
    contact_force_threshold: 8.0   # must stay above deadband_force on the bridge
    clear_hold_time: 0.3
    # ISOLATED VALIDATION (2026-08-26): next temporarily set to ReturnHome
    # instead of CloseGripper, to live-test MoveHome -> MoveToPick ->
    # ReturnHome alone before CloseGripper/MoveToPlace/OpenGripper (none
    # tested yet). Same staged pattern used for MoveHome earlier. Restore
    # `next: CloseGripper` (and the transition below) once this passes.
    next: ReturnHome
    gains:
      mass:
        linear:  [3, 3, 3]
        angular: [2, 2, 2]
      stiffness:
        linear:  [100, 100, 100]
        angular: [10, 10, 10]
      damping:
        linear:  [60, 60, 60]
        angular: [15, 15, 15]

  CloseGripper:
    base: Gripper
    action: close
    timeout: 2.0
    next: MoveToPlace

  # THE experiment-manipulation state: vary `waypoints` for trajectory shape
  # and `duration` for velocity between trials.
  MoveToPlace:
    base: ComplianceCartesianMove
    target:
      ref: place
    waypoints: []   # add via-points here to change the trajectory shape
    duration: 5.0    # shorten/lengthen to change arm velocity
    stiffness: 20.0
    damping: 10.0
    weight: 100.0
    contact_force_threshold: 8.0
    clear_hold_time: 0.3
    next: OpenGripper
    gains:
      mass:
        linear:  [3, 3, 3]
        angular: [2, 2, 2]
      stiffness:
        linear:  [100, 100, 100]
        angular: [10, 10, 10]
      damping:
        linear:  [60, 60, 60]
        angular: [15, 15, 15]

  OpenGripper:
    base: Gripper
    action: open
    timeout: 3.0
    next: ReturnHome

  ReturnHome:
    base: CartesianMove
    target:
      ref: home
    duration: 4.0
    stiffness: 4.0
    weight: 1000.0
    pos_threshold: 0.02
    settle_timeout: 5.0
    next: Idle

transitions:
  - [HoldCurrent,  HoldCurrent,  HoldCurrent,  Auto]
  # - [Unfold,       MoveHome,     MoveHome,     Auto]  # Unfold removed, see note near `init:` above
  - [MoveHome,     MoveToPick,   MoveToPick,   Auto]
  # - [MoveHome,     ReturnHome,   ReturnHome,   Auto]  # isolated MoveHome->ReturnHome validation bypass, reverted 2026-08-26 - see note near MoveHome above
  - [MoveToPick,   ReturnHome,   ReturnHome,   Auto]
  # - [MoveToPick,   CloseGripper, CloseGripper, Auto]  # isolated MoveHome->MoveToPick->ReturnHome validation bypass, 2026-08-26 - see note near MoveToPick above
  - [CloseGripper, MoveToPlace,  MoveToPlace,  Auto]
  - [MoveToPlace,  OpenGripper,  OpenGripper,  Auto]
  - [OpenGripper,  ReturnHome,   ReturnHome,   Auto]
  - [ReturnHome,   Idle,         Idle,         Auto]
constraints:
  - type: kinematics
  - type: dynamics
    damper: [0.1, 0.01, 0.5]
  - type: collision
    r1: kinova_6dof
    r2: kinova_6dof
    collisions:
      - type: all
        iDist: 0.15
        sDist: 0.05
        damping: 0.0
