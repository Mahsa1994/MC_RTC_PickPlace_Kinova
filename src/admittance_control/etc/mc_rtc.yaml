MainRobot: Kinova6DOF
Enabled: KinovaHandGuiding
# FIXED 2026-09-02: was 0.005, mismatched with the bridge's loop_dt_ (0.001,
# 1kHz) - same class of bug impedance_control's mc_rtc.yaml explicitly warns
# about ("Must match mc_rtc.yaml's global Timestep and the bridge's loop_dt").
# Must match KinovaHandGuiding.yaml's Timestep too.
Timestep: 0.001

Plugins:
  - ROS

ControllerModulePaths:
  - /usr/local/lib/mc_controller
  - /home/vscode/workspace/install/admittance_control/lib/mc_controller

StatesLibraries:
  - "/usr/local/lib/mc_controller/fsm/states"
  - "/home/vscode/workspace/install/admittance_control/lib/mc_controller/KinovaHandGuiding/states"

StatesFiles:
  - "/usr/local/lib/mc_controller/fsm/states/data"

kinova_6dof:
  stance:
    joint_1: [-0.1188]
    joint_2: [0.2618]
    joint_3: [3.13497]
    joint_4: [-2.269]
    joint_5: [1.2]   # NOT 0.0: exactly the joints-4/6 wrist singularity (see src/states/WristSingularity.h)
    joint_6: [0.959879]
