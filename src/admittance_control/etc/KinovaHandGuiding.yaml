Name: KinovaHandGuiding
MainRobot: Kinova6DOF
# Informational only: the control period actually comes from the global
# ~/.config/mc_rtc/mc_rtc.yaml (Timestep: 0.005) and the bridge reads it via
# gc_->timestep(), so the three can't drift apart.
Timestep: 0.005
Managed: false
StepByStep: false

ObserverPipelines:
  - name: MainPipeline
    observers:
      - type: Encoder
        update: true
        log: true
        position: encoderValues
        velocity: encoderVelocities

constraints:
  - type: kinematics
    damper: [0.1, 0.01, 0.5]
  - type: collision
    collisions:
      - body1: bracelet_link
        body2: base_link
        iDist: 0.05
        sDist: 0.02
        damping: 0.0
      - body1: forearm_link
        body2: base_link
        iDist: 0.05
        sDist: 0.02
        damping: 0.0

transitions:
  - [Init,              OK,             HoldPosition,     Auto]
  - [HoldPosition,      startGuiding,   HandGuide,        Auto]
  - [HandGuide,         stopGuiding,    UpdateHoldTarget, Auto]
  - [UpdateHoldTarget,  OK,             HoldPosition,     Auto]

init: Init

states:

  Init:
    base: MetaTasks
    completion:
      timeElapsed: true
      timeout: 0.01

  HoldPosition:
    base: KHG::HoldPositionState

  HandGuide:
    base: KHG::HandGuideState
    # rad/s per Nm, per joint in refJointOrder (joint_1..joint_6). Wrist joints
    # see smaller torques for the same hand force, so they get more admittance.
    admittance: [0.05, 0.05, 0.05, 0.08, 0.08, 0.08]
    maxJointVel: 0.5
    holdTorque: 0.5
    guideTorque: 1.0
    stiffness: 100.0
    damping: 20.0
    weight: 100.0

  UpdateHoldTarget:
    base: KHG::UpdateHoldTarget
