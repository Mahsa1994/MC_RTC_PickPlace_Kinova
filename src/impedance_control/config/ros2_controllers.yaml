controller_manager:
  ros__parameters:
    # 1000 -> 500 on 2026-10-12. At 1000 Hz the live log showed continuous
    # "Overrun detected! ... missed cycles : 2" with write time alone at
    # 650-880 us of a 1000 us budget. Irregular timing feeds the wrench ->
    # offset -> motion -> wrench limit cycle seen after a pull-release.
    # 500 Hz gives a 2000 us budget, which the same write fits inside with
    # room to spare. 500 also matches the value validated in pick_and_place.
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    effort_controller:
      type: forward_command_controller/ForwardCommandController

    robotiq_gripper_controller:
      type: position_controllers/GripperActionController

effort_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    interface_name: effort

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: true
    allow_integration_in_goal_trajectories: false
    allow_nonzero_velocity_at_trajectory_end: true
    stopped_velocity_tolerance: 0.05


robotiq_gripper_controller:
  ros__parameters:
    joint: robotiq_85_left_knuckle_joint
    action_monitor_rate: 20.0
    allow_stalling: true
    max_effort: 100.0
