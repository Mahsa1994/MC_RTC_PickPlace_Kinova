MainRobot: Kinova6DOF
Enabled: KinovaImpedance
# Aligned with etc/KinovaImpedance.yaml and the bridge's loop_dt (1kHz) - see
# the comment there. Previously 0.002 here vs 0.001 in KinovaImpedance.yaml
# and the bridge's wall-clock loop.
Timestep: 0.001
LogPolicy: threaded

Plugins:
  - ROS

ObserverPipelines:
  - name: MainPipeline
    observers:
      update: true
      log: true
      position: encoderValues
      velocity: encoderVelocities
      #velocity: encoderFiniteDifferences

ControllerModulePaths:
  - /usr/local/lib/mc_controller
  - /home/vscode/workspace/install/impedance_control/lib/mc_controller

StatesLibraries:
  - /usr/local/lib/mc_controller/fsm/states
  - /home/vscode/workspace/install/impedance_control/lib/mc_controller/KinovaImpedance/states

StatesFiles:
  - /usr/local/lib/mc_controller/fsm/states/data
