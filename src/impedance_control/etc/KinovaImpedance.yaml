Name: KinovaImpedance
MainRobot: Kinova6DOF
Timestep: 0.005
Managed: false
StepByStep: false

ObserverPipelines:
  - name: MainPipeline
    observers:
      - type: Encoder
        update: true
        log: true
        position: encoderValues
        velocity: encoderVelocities

constraints:
  - type: kinematics
    damper: [0.1, 0.01, 0.5]
  - type: collision
    collisions:
      - body1: bracelet_link
        body2: base_link
        iDist: 0.05
        sDist: 0.02
        damping: 0.0
      - body1: forearm_link
        body2: base_link
        iDist: 0.05
        sDist: 0.02
        damping: 0.0

transitions:
  - [Init, OK, ImpedanceHold, Auto]

init: Init

states:

  Init:
    base: MetaTasks
    completion:
      timeElapsed: true
      timeout: 0.01

  ImpedanceHold:
    base: KI::ImpedanceHoldState
    # Compliance tuning — no recompile needed, edit here and rebuild package
    #
    # stiffness: how hard the arm pulls back to path (lower = more compliant)
    #   - too low:  arm drifts and doesn't return well
    #   - too high: arm is stiff, hard to push
    #   - start: 50, tune up to 200 for stiffer return
    stiffness: 3.0
    #
    # damping: 2*sqrt(stiffness) for critical damping (no overshoot on return)
    #   stiffness=50  → damping=14.14
    #   stiffness=100 → damping=20.0
    #   stiffness=200 → damping=28.28
    damping: 2 #14.14
    #
    # weight: priority in QP — lower weight yields more easily to joint limits
    # and collision constraints. Keep below posture task weight (typically 1).
    weight: 100.0
