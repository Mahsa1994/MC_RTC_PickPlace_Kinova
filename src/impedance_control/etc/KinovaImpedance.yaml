Name: KinovaImpedance
MainRobot: Kinova6DOF
# Must match mc_rtc.yaml's global Timestep and the bridge's loop_dt (1kHz).
# A mismatch here desyncs the impedance model's integration rate from
# wall-clock time, which can turn an intentionally overdamped virtual
# spring-damper into an underdamped/oscillatory one in real time.
Timestep: 0.001
Managed: false
StepByStep: false

ObserverPipelines:
  - name: MainPipeline
    observers:
      - type: Encoder
        update: true
        log: true
        position: encoderValues
        velocity: encoderVelocities

constraints:
  - type: kinematics
    damper: [0.1, 0.01, 0.5]
  - type: collision
    collisions:
      - body1: bracelet_link
        body2: base_link
        iDist: 0.05
        sDist: 0.02
        damping: 0.0
      - body1: forearm_link
        body2: base_link
        iDist: 0.05
        sDist: 0.02
        damping: 0.0

transitions:
  - [Init, OK, ImpedanceHold, Auto]

init: Init

states:

  Init:
    base: MetaTasks
    completion:
      timeElapsed: true
      timeout: 0.01

  ImpedanceHold:
      base: KI::ImpedanceHoldState

      # Kinematic Tracking Gains (reduced slightly to smooth out high-frequency target jumps)
      stiffness: 20.0
      damping: 10.0
      weight: 100.0

      # Warn (not a hard stop yet) if the compliance pose strays further than
      # this from the held target - see ImpedanceHoldState::run().
      maxDeflection: 0.15

      # NOTE: force/torque deadbanding is NOT done here - it's already
      # applied upstream in kortex_mc_rtc_bridge_impedance.cpp
      # (deadband_force / deadband_moment params) before the wrench ever
      # reaches this state, for both the real robot and Gazebo (same bridge
      # executable - see launch/impedance_gazebo.launch.py). A
      # `wrenchThreshold` key used to live here but was never read by
      # ImpedanceHoldState - removed so it doesn't look like protection that
      # wasn't actually wired up.

      # Impedance Filter Gains (Highly Overdamped for Simulation)
      # Lower stiffness (5.0) makes the virtual spring soft and easy to push.
      # High damping (25.0) absorbs the Gazebo PID chatter and prevents jerky limit cycles.
      #gains:
      gains:
        mass:
          angular: [2.0, 2.0, 2.0]
          linear: [3.0, 3.0, 3.0]
        stiffness:
          angular: [20.0, 20.0, 20.0]     # Much softer spring
          linear: [100.0, 100.0, 100.0]
        damping:
          angular: [20.0, 20.0, 20.0]   # Heavily damped to eliminate chattering
          linear: [60.0, 60.0, 60.0]
        wrench:
          angular: [1.0, 1.0, 1.0]
          linear: [1.0, 1.0, 1.0]
