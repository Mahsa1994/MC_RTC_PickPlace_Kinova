Name: KinovaImpedance
MainRobot: Kinova6DOF
Timestep: 0.001  #0.005
Managed: false
StepByStep: false

ObserverPipelines:
  - name: MainPipeline
    observers:
      - type: Encoder
        update: true
        log: true
        position: encoderValues
        velocity: encoderVelocities

constraints:
  - type: kinematics
    damper: [0.1, 0.01, 0.5]
  - type: collision
    collisions:
      - body1: bracelet_link
        body2: base_link
        iDist: 0.05
        sDist: 0.02
        damping: 0.0
      - body1: forearm_link
        body2: base_link
        iDist: 0.05
        sDist: 0.02
        damping: 0.0

transitions:
  - [Init, OK, ImpedanceHold, Auto]

init: Init

states:

  Init:
    base: MetaTasks
    completion:
      timeElapsed: true
      timeout: 0.01

  ImpedanceHold:
      base: KI::ImpedanceHoldState

      # ── Kinematic Tracking Gains (reduced slightly to smooth out high-frequency target jumps)
      stiffness: 20.0
      damping: 10.0
      weight: 100.0

      wrenchThreshold:
        force: [3.0, 3.0, 3.0]
        torque: [1.0, 1.0, 1.0]

      # ── Impedance Filter Gains (Highly Overdamped for Simulation)
      # Lower stiffness (5.0) makes the virtual spring soft and easy to push.
      # High damping (25.0) absorbs the Gazebo PID chatter and prevents jerky limit cycles.
      #gains:
      gains:
        mass:
          angular: [2.0, 2.0, 2.0]
          linear: [3.0, 3.0, 3.0]
        stiffness:
          angular: [8.0, 8.0, 8.0]     # Much softer spring
          linear: [10.0, 10.0, 10.0]
        damping:
          angular: [15.0, 15.0, 15.0]   # Heavily damped to eliminate chattering
          linear: [25.0, 25.0, 25.0]
        wrench:
          angular: [1.0, 1.0, 1.0]
          linear: [1.0, 1.0, 1.0]
