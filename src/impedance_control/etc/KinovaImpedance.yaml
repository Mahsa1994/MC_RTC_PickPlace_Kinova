Name: KinovaImpedance
MainRobot: Kinova6DOF
Timestep: 0.005
Managed: false
StepByStep: false

ObserverPipelines:
  - name: MainPipeline
    observers:
      - type: Encoder
        update: true
        log: true
        position: encoderValues
        velocity: encoderVelocities

# ImpedanceTask internally computes joint torques, so switch to dynamics constraint
constraints:
  - type: dynamics
    damper: [0.1, 0.01, 0.5]
  - type: collision
    collisions:
      - body1: bracelet_link
        body2: base_link
        iDist: 0.05
        sDist: 0.02
        damping: 0.0
      - body1: forearm_link
        body2: base_link
        iDist: 0.05
        sDist: 0.02
        damping: 0.0

transitions:
  - [Init, OK, ImpedanceHold, Auto]

init: Init

states:

  Init:
    base: MetaTasks
    completion:
      timeElapsed: true
      timeout: 0.01

  ImpedanceHold:
    base: MetaTasks
    tasks:
      impedance_ee:
        type: impedance
        frame: bracelet_link   # <-- your EE frame name (check your URDF)
        weight: 1000
        stiffness: 5
        # target: set at runtime in C++ using targetPose(), or set a fixed world pose here
        wrench:
          couple: [0.0, 0.0, 0.0]
          force:  [0.0, 0.0, 0.0]   # desired external force = 0 (free space)
        gains:
          spring:                    # K — stiffness that pulls back to path
            angular: [10.0, 10.0, 10.0]
            linear:  [200.0, 200.0, 200.0]
          damper:                    # D — damps oscillations
            angular: [6.32, 6.32, 6.32]
            linear:  [28.28, 28.28, 28.28]
          mass:                      # M — virtual inertia (tune last)
            angular: [1.0, 1.0, 1.0]
            linear:  [1.0, 1.0, 1.0]
          wrench:                    # gain on wrench error (0 = pure position tracking)
            angular: [1.0, 1.0, 1.0]
            linear:  [1.0, 1.0, 1.0]
